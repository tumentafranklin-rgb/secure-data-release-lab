name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Run unit tests
        run: python -m unittest -v

      - name: Install Bandit
        run: python -m pip install bandit==1.9.4

      - name: Scan application code with Bandit
        run: bandit app.py

      - name: Scan for secrets with Gitleaks
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir --redact=100 /repo

      - name: Build and export application image
        run: |
          docker build -t secure-data-release-lab:ci .
          docker save -o "$RUNNER_TEMP/secure-data-release-lab.tar" secure-data-release-lab:ci

      - name: Scan container image with Trivy
        run: |
          docker run --rm \
            --volume "$RUNNER_TEMP/secure-data-release-lab.tar:/image.tar:ro" \
            aquasec/trivy:0.69.3 image \
            --input /image.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1

      - name: Save scanned image for publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: scanned-container-image
          path: ${{ runner.temp }}/secure-data-release-lab.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-image:
    name: Publish scanned image to ECR
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 632773076321.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: secure-data-release-lab

    steps:
      - name: Download the scanned image
        uses: actions/download-artifact@v4
        with:
          name: scanned-container-image
          path: ${{ runner.temp }}

      - name: Load the scanned image
        run: docker load --input "$RUNNER_TEMP/secure-data-release-lab.tar"

      - name: Assume the AWS publishing role
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish image and verify digest
        run: |
          set -euo pipefail
          image_tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_uri="$ECR_REGISTRY/$ECR_REPOSITORY:$image_tag"

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

          docker tag secure-data-release-lab:ci "$image_uri"
          docker push "$image_uri"

          aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$image_tag" \
            --query 'imageDetails[0].{Tags:imageTags,Digest:imageDigest}' \
            --output json