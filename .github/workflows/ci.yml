name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Run unit tests
        run: python -m unittest -v

      - name: Install Bandit
        run: python -m pip install bandit==1.9.4

      - name: Scan application code with Bandit
        run: bandit app.py

      - name: Scan for secrets with Gitleaks
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir --redact=100 /repo

      - name: Build and export application image
        run: |
          docker build -t secure-data-release-lab:ci .
          docker save -o "$RUNNER_TEMP/secure-data-release-lab.tar" secure-data-release-lab:ci

      - name: Scan container image with Trivy
        run: |
          docker run --rm \
            --volume "$RUNNER_TEMP/secure-data-release-lab.tar:/image.tar:ro" \
            aquasec/trivy:0.69.3 image \
            --input /image.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1